name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          # For a plain static site serving the repo root, upload the repository root.
          # If your built site is in a folder (e.g. dist, public, _site), change this to that folder.
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
